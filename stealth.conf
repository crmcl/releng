# Stealth Transform Configuration
# Edit these values to produce a different stealth namespace.
# This file is sourced by apply-stealth.sh.

# ─── Identity ───────────────────────────────────────────────
# Primary lowercase name used for binaries, CLI tools, options, C functions
STEALTH_NAME="yszint"
# Primary PascalCase name used for namespaces, GObject types, GIR
STEALTH_NAME_PASCAL="Yszint"
# Primary UPPER_CASE name used for C enums, macros
STEALTH_NAME_UPPER="YSZINT"

# ─── Network ────────────────────────────────────────────────
# Default server port (upstream: 27042)
STEALTH_PORT="5233"

# ─── D-Bus / Android ────────────────────────────────────────
# Reverse-domain prefix for D-Bus services and Android components
# upstream: "re.frida"
STEALTH_RDNS="re.yszint"

# ─── SELinux ─────────────────────────────────────────────────
# SELinux file type label (upstream: "frida_file")
STEALTH_SELINUX_TYPE="yszint_file"

# ─── Protocol ───────────────────────────────────────────────
# Message protocol prefix (upstream: "frida:")
STEALTH_PROTO_PREFIX="yszint:"

# ─── Packaging ──────────────────────────────────────────────
STEALTH_AUTHOR="Yszint Developers"
STEALTH_EMAIL="yszint@proton.me"
STEALTH_URL="https://github.com/crmcl/yszint"

# ─── V8 Engine ──────────────────────────────────────────────
STEALTH_V8_EMBEDDER="-yszint"

# ─── Custom Forks ───────────────────────────────────────────
# These deps.toml URLs are replaced from upstream frida repos
# Format: "upstream_url|replacement_url" (pipe-separated pairs)
STEALTH_FORK_URLS=(
  "https://github.com/nicolo-ribaudo/aspect-build-aspect-cli|https://github.com/crmcl/v8"
)

# ─── Thread Names ───────────────────────────────────────────
# Prefix for internal thread names (upstream: "frida-")
STEALTH_THREAD_PREFIX="yszint-"

# ─── File Prefix Maps (debug info obfuscation) ─────────────
# Maps source directory names in debug info
# Format: "original=replacement"
STEALTH_PREFIX_MAPS=(
  "frida-core=yszint-core"
  "frida-gum=yszint-gum"
)

# ─── Paths NOT to rename ────────────────────────────────────
# These patterns are EXCLUDED from renaming.
# Subproject directory names, library output names, Python import name,
# upstream dep URLs, .wrap files, and test files.
STEALTH_EXCLUDE_PATHS=(
  "*/node_modules/*"
  "*/__pycache__/*"
  "*/build/*"
  "deps/*"
  "*.wrap"
  ".git/*"
)

# ─── Files that get full content replacement ────────────────
# These files are regenerated rather than sed-transformed.
# The script handles them specially.
STEALTH_SPECIAL_FILES=(
  "releng/yszint_version.py"
)
